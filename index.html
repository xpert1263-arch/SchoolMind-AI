<!doctype html>
<html lang="uz" class="light" data-mode="student">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d9488" />
    <meta
      name="description"
      content="SchoolMind — AI maktab yordamchisi. O'quvchi va o'qituvchi uchun bitta ish muhiti."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>SchoolMind — AI School Assistant</title>
    <script>
      // Apply persisted theme before first paint to avoid a flash.
      (function () {
        try {
          var raw = localStorage.getItem('schoolmind.v1');
          var s = raw ? JSON.parse(raw) : null;
          var theme = (s && s.theme) || 'light';
          var mode = (s && s.mode) || 'student';
          var locale = (s && s.locale) || 'uz';
          var el = document.documentElement;
          el.classList.toggle('dark', theme === 'dark');
          el.classList.toggle('light', theme !== 'dark');
          el.setAttribute('data-mode', mode);
          el.setAttribute('lang', locale);
        } catch (e) {
          /* storage unavailable — fall back to markup defaults */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
